[metadata]
name = "Workspaces (Pi)"
description = "Browse and resume Pi conversations by workspace folder"

[source]
command = "/var/home/samuel/.local/bin/tv-workspaces.py list"
display = "{split:\t:0}"
output = "{split:\t:1}"

[ui]
orientation = "portrait"

[ui.preview_panel]
size = 60
scrollbar = true
word_wrap = true
border_type = "thick"
hidden = false

[preview]
command = "/var/home/samuel/.local/bin/tv-workspaces.py preview '{split:\t:1}'"

[keybindings]
enter = "actions:open"
alt-space = "actions:open"
ctrl-n = "actions:new"
ctrl-b = "actions:betahat"
ctrl-h = "actions:beta"
ctrl-l = "actions:pi"
ctrl-m = "actions:move"
ctrl-r = "actions:rename"

[actions.open]
description = "Open folder or resume session with pihat"
command = "/var/home/samuel/.local/bin/tv-workspaces.py action open '{split:\t:1}'"
mode = "execute"

[actions.new]
description = "New conversation in workspace"
command = "/var/home/samuel/.local/bin/tv-workspaces.py action new '{split:\t:1}'"
mode = "execute"

[actions.beta]
description = "Resume with beta (Stata container + local)"
command = "/var/home/samuel/.local/bin/tv-workspaces.py action beta '{split:\t:1}'"
mode = "execute"

[actions.betahat]
description = "Resume with betahat (Stata container + cloud)"
command = "/var/home/samuel/.local/bin/tv-workspaces.py action betahat '{split:\t:1}'"
mode = "execute"

[actions.pi]
description = "Resume with pi (local)"
command = "/var/home/samuel/.local/bin/tv-workspaces.py action pi '{split:\t:1}'"
mode = "execute"

[actions.pihat]
description = "Resume with pihat (cloud models)"
command = "/var/home/samuel/.local/bin/tv-workspaces.py action pihat '{split:\t:1}'"
mode = "execute"

[actions.move]
description = "Move/stash conversation to another workspace"
command = "/var/home/samuel/.local/bin/tv-workspaces.py action move '{split:\t:1}'"
mode = "execute"

[actions.rename]
description = "Rename workspace folder"
command = "/var/home/samuel/.local/bin/tv-workspaces.py action rename '{split:\t:1}'"
mode = "execute"
