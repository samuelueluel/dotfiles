# Web-facing TurboVault base profile (Open WebUI / less-trusted clients).
# This file is the SHARED base for both web instances:
#   - read-only instance (default): launch with --allowed-tools <read-only list>
#   - full instance (opt-in): launch with no restriction flags
# The pi CLI profile uses config.yaml and is intentionally separate.
vaults:
  - name: personal
    path: /var/home/samuel/Dropbox/Sam-Obsidian-Vault
    is_default: true
    write_backend: git
    git:
      include_ignored: false
      require_commit_message: true
    watch_for_changes: true
    allowed_extensions:
      - .md
      - .markdown
    excluded_paths:
      - .obsidian
      - .trash
      - .git
    enable_caching: true
    cache_ttl: 300
    allowed_operations:
      - all

observability:
  log_level: info
  security_auditing: true
  performance_monitoring: true

batch:
  conflict_strategy: strict
