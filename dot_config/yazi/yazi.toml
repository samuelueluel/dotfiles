[mgr]
ratio = [0, 4, 6]
linemode = "mtime"

[opener]
edit = [
  { run = 'zed --new "$@"', desc = "Zed", orphan = true },
]
view_image = [
  { run = 'swayimg "$@"', desc = "swayimg", orphan = true },
]
view_pdf = [
  { run = 'flatpak run org.kde.okular "$@"', desc = "Okular", orphan = true },
]
open = [
  { run = 'xdg-open "$1"', desc = "xdg-open", orphan = true },
]
extract = [
  { run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
]


[open]
prepend_rules = [
  { url = "*.md", use = "edit" },
  { mime = "image/*", use = "view_image" },
  { url = "*.pdf", use = "view_pdf" },
  { mime = "application/pdf", use = "view_pdf" },
  { mime = "text/*",        use = "edit" },
  { mime = "application/json",        use = "edit" },
  { mime = "application/toml",        use = "edit" },
  { mime = "application/xml",         use = "edit" },
  { mime = "application/javascript",  use = "edit" },
  { mime = "application/x-sh",        use = "edit" },
  { mime = "inode/x-empty",           use = "edit" },
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", use = [ "open", "extract" ] },
  { mime = "*", use = "open" },
]

[preview]
wrap = "yes"

[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"

